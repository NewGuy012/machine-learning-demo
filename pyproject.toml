[project]
name = "machine-learning-demo"
version = "0.2.0"
description = "Interactive, visual machine learning demos built with Marimo, scikit-learn, and Plotly."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.20.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.14.0",
]

[dependency-groups]
dev = [
    "kaleido>=0.2.1",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B018",  # Marimo cells intentionally end with bare expressions for display
    "E501",  # Markdown blocks inside mo.md(...) can contain long prose lines
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = [
    "F401",  # Top-level helper/UI imports used across Marimo cells
]
