[project]
name = "machine-learning-demo"
version = "0.2.0"
description = "Interactive, visual machine learning demos built with Marimo, scikit-learn, and Plotly."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.15"
dependencies = [
    "marimo>=0.26.0",
    "numpy>=2.5.5",
    "plotly>=7.2.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
assets = [
    "kaleido>=1.5.2",
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "C4", "ARG"]
ignore = [
    "B018",  # Marimo cells end with bare expressions for display
    "E501",  # Markdown blocks inside mo.md(...) can contain long prose lines
]
